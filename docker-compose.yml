services:
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=dev
      - POSTGRES_PASSWORD=dev
      - POSTGRES_DB=bookstore_dev_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d bookstore_dev_db"]
      interval: 2s
      timeout: 5s
      retries: 15
    networks:
      - bookstore-network

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - ./env.dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bookstore-network

volumes:
  postgres_data:

# rede explícita (bridge) para o web conversar com o db pelo nome do serviço
networks:
  bookstore-network:
    driver: bridge

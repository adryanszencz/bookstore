name: Code review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  flake8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # comenta no próprio PR as linhas que quebram o padrão de estilo (PEP 8)
      - uses: reviewdog/action-flake8@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail_level: error
